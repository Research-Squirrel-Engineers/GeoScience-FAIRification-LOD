name: Publish documentation pages

# docu/ goes to gh-pages under /docu/. The folder is generated by visuals/build.py and committed, as visuals/site/ is.
# Unicorn ontdoc (main.yml) writes docs/ to the same branch; the target folders differ, so neither removes the other.
on:
  push:
    branches: ["main"]
    paths: ["docu/**"]
  workflow_dispatch:

permissions:
  contents: write

# One group for every workflow that writes to gh-pages: two pushes to the branch at the same moment
# make the second fail with "cannot lock ref". Queued, not cancelled, so no deployment is dropped.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docu
          target-folder: docu
          clean: true
