name: Publish documentation pages

# docu/ goes to gh-pages under /docu/. The folder is generated by visuals/build.py and committed. It holds the
# documentation, the slide figures and the cluster pages: one site, one navigation.
# pages-root/index.html goes to the root of gh-pages and sends visitors to /docu/.
# Unicorn ontdoc (main.yml) writes its pages to /semweb/; the three target folders differ, so none removes another.
on:
  push:
    branches: ["main"]
    paths: ["docu/**", "pages-root/**"]
  workflow_dispatch:

permissions:
  contents: write

# One group for every workflow that writes to gh-pages: two pushes to the branch at the same moment
# make the second fail with "cannot lock ref". Queued, not cancelled, so no deployment is dropped.
# Both deployments of this workflow run as steps of one job, so a pending run cannot replace one of them.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy docu/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docu
          target-folder: docu
          clean: true
      - name: Deploy root page
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages-root
          clean: false
