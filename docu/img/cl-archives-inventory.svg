<text x="50" y="40" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="26" font-weight="500" fill="#1f1f1d">Which classes have nodes in the committed graphs</text>
<text x="50" y="76" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="19" fill="#55544f">Asserted: nodes typed with the class itself. With subclasses: nodes typed with it or any class below it (rdfs:subClassOf).</text>
