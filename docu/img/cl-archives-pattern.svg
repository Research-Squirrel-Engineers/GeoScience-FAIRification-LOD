<rect x="539.3" y="525.0" width="201.4" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="640.0" y="536.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">sosa:hasFeatureOfInterest</text>
<rect x="50" y="595" width="280" height="72" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.2"/>
<text x="190.0" y="620.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">epica:dataset_dd</text>
<text x="190.0" y="646.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:IceCoreDataset · crm:E73</text>
<line x1="330" y1="631.0" x2="500" y2="631.0" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="415.0" y="613.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:hasObservation</text>
<text x="960" y="619.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#9a3412">Where the source gives no interval, the observation points</text>
<text x="960" y="645.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#9a3412">to the core itself, epica:core_edc.</text>
<line x1="50" y1="717" x2="1700" y2="717" stroke="#d8d6ce" stroke-width="1.2"/>
<text x="50" y="767" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="22" font-weight="500" fill="#1f1f1d">The speleothem: entity and sample from the SISAL tables, IRIs and properties as sisal_rdf.py writes them</text>
<rect x="50" y="827" width="280" height="72" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.2"/>
<text x="190.0" y="852.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">sisal:sample_0026516</text>
<text x="190.0" y="878.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:SpeleothemSample · crm:E18</text>
<rect x="500" y="827" width="280" height="72" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.2"/>
<text x="640.0" y="852.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">sisal:entity_00055</text>
<text x="640.0" y="878.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:Speleothem · crm:E18</text>
<rect x="950" y="827" width="280" height="72" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.2"/>
