<text x="640.0" y="620.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">epica:obs_dd_0001</text>
<text x="640.0" y="646.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">an observation of the dataset</text>
