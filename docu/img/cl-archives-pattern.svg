<line x1="1400" y1="251.0" x2="1230" y2="251.0" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1315.0" y="233.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">crm:P89_falls_within</text>
<path d="M190.0 215 L190.0 179 L1090.0 179 L1090.0 213" fill="none" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="564.9" y="168" width="150.2" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="640.0" y="179" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:tookPlaceAt</text>
