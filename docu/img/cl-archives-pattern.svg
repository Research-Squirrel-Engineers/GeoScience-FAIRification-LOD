<text x="1090.0" y="878.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:Cave · crm:E27</text>
<line x1="330" y1="863.0" x2="500" y2="863.0" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
