<text x="640.0" y="430.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">epica:sample_dd_0001</text>
<text x="640.0" y="456.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:SampleSection · crm:E18</text>
<line x1="640.0" y1="405" x2="640.0" y2="287" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
