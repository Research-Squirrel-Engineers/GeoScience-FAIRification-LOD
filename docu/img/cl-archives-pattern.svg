<text x="1090.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">epica:site_dome_c</text>
<text x="1090.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:DrillingSite · crm:E27</text>
