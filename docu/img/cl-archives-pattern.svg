<svg width="1750" height="1240" viewBox="0 0 1750 1240" xmlns="http://www.w3.org/2000/svg" role="img"><title>From a place to a measured thing</title>
<rect width="1750" height="1240" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#55544f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="17" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#ffffff" stroke="#55544f" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="warm" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f9dfb8"/><circle cx="7" cy="7" r="1.6" fill="#d9974a"/></pattern><pattern id="cold" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="11" fill="#cfe3f3"/><line x1="0" y1="0" x2="0" y2="11" stroke="#7fb0d6" stroke-width="2.4"/></pattern></defs>
<text x="50" y="40" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="26" font-weight="500" fill="#1f1f1d">A place, a thing taken from it, and the part that was measured: three nodes, not one</text>
<text x="50" y="76" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#55544f">The site is a place (crm:E27), the core a physical object (crm:E22), the section a part of it (crm:E18); the campaign that removed it is an activity.</text>
<text x="50" y="132" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="22" font-weight="500" fill="#1f1f1d">The ice core: nodes of EPICA/rdf/epica_dome_c.ttl</text>
<rect x="50" y="215" width="280" height="72" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.2"/>
<text x="190.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">epica:campaign_1996_2004</text>
<text x="190.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:DrillingCampaign · crm:E7</text>
<rect x="500" y="215" width="280" height="72" rx="8" fill="#fff2cc" stroke="#000000" stroke-width="1.2"/>
<text x="640.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="18" font-weight="500" fill="#000000">epica:core_edc</text>
<text x="640.0" y="266.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:IceCore · crm:E22</text>
