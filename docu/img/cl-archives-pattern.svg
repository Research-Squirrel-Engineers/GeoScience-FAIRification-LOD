<text x="640.0" y="1038.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:EntityStatus · crm:E55</text>
<line x1="640.0" y1="987" x2="640.0" y2="899" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="564.2" y="932.0" width="151.6" height="22" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="640.0" y="943.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:entityStatus</text>
<text x="1280" y="851.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#9a3412">Jaraguá cave, speleothem JAR7</text>
<text x="1280" y="877.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#9a3412">sample taken 580.83 mm from the top</text>
<text x="50" y="1170" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">In both chains the place, the thing taken from it and the part measured are three nodes with three CRM anchors; a measurement can then say which of them it is about.</text>
<text x="50" y="1200" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">The speleothem nodes belong to the large graph the pipeline writes; the committed Turtle holds the 365 caves and the dating points only.</text>
</svg>
