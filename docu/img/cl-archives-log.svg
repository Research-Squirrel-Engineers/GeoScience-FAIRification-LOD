<rect x="1290" y="150" width="590" height="412" rx="10" fill="#fbfbf9" stroke="#bdbbb2" stroke-width="1.2" stroke-dasharray="7 6"/>
<text x="1308" y="180" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="21" font-weight="500" fill="#1f1f1d">The layer below: wd1:unit_107</text>
<text x="1308" y="212" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">strat:LithologicalUnit, a strat:StratigraphicUnit</text>
<text x="1308" y="267.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">rdfs:label</text>
<text x="1862" y="267.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">brown and dark greyish sapro…</text>
<text x="1308" y="309.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">strat:depthTop</text>
<text x="1862" y="309.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">86.43 m</text>
<text x="1308" y="351.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">strat:depthBottom</text>
