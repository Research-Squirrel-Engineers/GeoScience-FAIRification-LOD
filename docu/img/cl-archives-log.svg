<text x="1308" y="386" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">strat:partOfCore</text>
<rect x="1308" y="402" width="554" height="48" rx="7" fill="#d8ead3" stroke="#000000" stroke-width="1.1"/>
<text x="1585.0" y="416" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="17" font-weight="500" fill="#000000">wd1:WD1</text>
<text x="1585.0" y="435" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">strat:Core</text>
<text x="1308" y="472" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">strat:meets</text>
<rect x="1308" y="488" width="554" height="48" rx="7" fill="#d8ead3" stroke="#000000" stroke-width="1.1"/>
<text x="1585.0" y="502" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="17" font-weight="500" fill="#000000">wd1:unit_108</text>
<text x="1585.0" y="521" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">strat:StratigraphicUnit</text>
<text x="50" y="630" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">Dashed: the strat: classes are planned in geo-lod, and the pipeline does not write WD1 yet; these 111 units are built from the CSV for this page.</text>
<text x="50" y="660" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">A row that the log leaves undescribed is still a unit with its depths: the log is a chain of intervals, whatever it says about them.</text>
</svg>
