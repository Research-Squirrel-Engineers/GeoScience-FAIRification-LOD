<text x="50" y="940" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">17 of the 20 properties of the observation are drawn; left out: geolod:fallsWithinStage, geolod:hasTimePosition, rdfs:label.</text>
<text x="50" y="970" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">One node, three vocabularies: the SOSA view and the CRM view need no value of the third, and a reader of either finds the same observation.</text>
