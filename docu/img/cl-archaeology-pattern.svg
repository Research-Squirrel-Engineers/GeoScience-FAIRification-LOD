<svg width="1900" height="776" viewBox="0 0 1900 776" xmlns="http://www.w3.org/2000/svg" role="img"><title>One archaeological reading on two kinds of place</title>
<rect width="1900" height="776" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#55544f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="t" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="17" markerHeight="17" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#ffffff" stroke="#55544f" stroke-width="1.3" stroke-linejoin="round"/></marker><pattern id="warm" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f9dfb8"/><circle cx="7" cy="7" r="1.6" fill="#d9974a"/></pattern><pattern id="cold" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="11" height="11" fill="#cfe3f3"/><line x1="0" y1="0" x2="0" y2="11" stroke="#7fb0d6" stroke-width="2.4"/></pattern></defs>
<text x="50" y="40" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="26" font-weight="500" fill="#1f1f1d">The same four statements on a cave and on a findspot, and a findspot without them</text>
<text x="50" y="76" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="19" fill="#55544f">The properties sit on crm:E27_Site, so both branches use them; their absence is not a negative result.</text>
<rect x="50" y="150" width="590" height="496" rx="10" fill="#fbfbf9" stroke="#bdbbb2" stroke-width="1.2"/>
<text x="68" y="180" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="21" font-weight="500" fill="#1f1f1d">A cave, read: geolod:Cave_site_0077</text>
<text x="68" y="212" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:ArchaeologicalCaveSite, a geolod:Cave and a crmarchaeo:A2</text>
<text x="68" y="267.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">rdfs:label</text>
<text x="622" y="267.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">Chauvet cave</text>
<text x="68" y="302" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:archaeologicalBroaderContext</text>
<rect x="68" y="318" width="554" height="48" rx="7" fill="#fff2cc" stroke="#000000" stroke-width="1.1"/>
