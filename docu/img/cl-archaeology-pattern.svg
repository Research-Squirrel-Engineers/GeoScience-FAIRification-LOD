<text x="1585.0" y="544" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="17" font-weight="500" fill="#000000">github.com/…/campanian-ignimbrite-geo</text>
<text x="1585.0" y="563" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">a repository, no node of its own in the graph</text>
<text x="50" y="714" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">Chauvet cave and the CI findspots are read from the committed graphs; every row is a statement of the node above it.</text>
<text x="50" y="744" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">A property that is missing says that nobody has looked (a different statement from 'looked and found nothing'), which the page counts on the next figure.</text>
