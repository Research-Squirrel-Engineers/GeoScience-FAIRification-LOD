<rect x="670" y="150" width="590" height="496" rx="10" fill="#fbfbf9" stroke="#bdbbb2" stroke-width="1.2"/>
<text x="688" y="180" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="21" font-weight="500" fill="#1f1f1d">A findspot, read: ci:cisite_42</text>
<text x="688" y="212" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:CIArchaeologicalSite, a geolod:CIFindspot and a crmarchaeo:A2</text>
