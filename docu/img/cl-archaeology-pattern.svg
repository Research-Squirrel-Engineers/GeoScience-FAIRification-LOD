<text x="1308" y="479.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:hasCertaintyLevel</text>
<text x="1862" y="479.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">medium, on the geometry</text>
