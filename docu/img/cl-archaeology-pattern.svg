<text x="345.0" y="351" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">geolod:ArchaeologicalContext</text>
<text x="68" y="395.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:archaeologicalCategory</text>
<text x="622" y="395.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">Palaeolithic Art</text>
<text x="68" y="437.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:archaeologicalConfidence</text>
<text x="622" y="437.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">high</text>
