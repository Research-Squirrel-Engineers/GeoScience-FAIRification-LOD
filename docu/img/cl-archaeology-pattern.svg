<text x="1308" y="180" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="21" font-weight="500" fill="#1f1f1d">A findspot, not read: ci:cisite_1</text>
<text x="1308" y="212" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:CIFindspot only: no statement about archaeology</text>
<text x="1308" y="267.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">rdfs:label</text>
<text x="1862" y="267.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">Acerra Sink</text>
<text x="1308" y="309.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:hasLiteratureReference</text>
<text x="1862" y="309.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">Scandone et al., 1991</text>
<text x="1308" y="351.0" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="16" fill="#55544f">geolod:screenedForArchaeology</text>
<text x="1862" y="351.0" text-anchor="end" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#1f1f1d">no statement</text>
