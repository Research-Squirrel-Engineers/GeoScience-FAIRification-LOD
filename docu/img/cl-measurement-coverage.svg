<text x="50" y="678" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">The two smoothed values sit under two property names of their own (smoothedValue_rollingMedian, smoothedValue_savgol), one per filter, not under one generic property.</text>
