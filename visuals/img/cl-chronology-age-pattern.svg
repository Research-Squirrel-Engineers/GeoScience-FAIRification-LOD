<text x="50" y="40" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="26" font-weight="500" fill="#1f1f1d">Why an age is an assignment and not a property</text>
<text x="50" y="76" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="19" fill="#55544f">One sample of JAR7 (sisal:sample_0026516, depth 580.83 mm), drawn two ways.</text>
<text x="50" y="130" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="22" font-weight="500" fill="#1f1f1d">As a property of the sample</text>
