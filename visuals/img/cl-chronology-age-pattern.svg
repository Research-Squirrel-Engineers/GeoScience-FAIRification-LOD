<text x="230.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="19" font-weight="500" fill="#000000">sisal:sample_0026516</text>
<text x="230.0" y="205.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">a geolod:SpeleothemSample</text>
<line x1="410" y1="191" x2="760" y2="191" stroke="#55544f" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="517.0" y="179.0" width="135.9" height="24" rx="4" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="585.0" y="191.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">geolod:ageKaBP</text>
<rect x="760" y="165" width="230" height="52" rx="8" fill="#f6f6f3" stroke="#000000" stroke-width="1.2"/>
<text x="875.0" y="181.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="19" font-weight="500" fill="#000000">10.150714</text>
<text x="875.0" y="205.0" text-anchor="middle" dominant-baseline="central" font-family="Fira Sans" font-size="14" fill="#3a3935">xsd:decimal</text>
<text x="1030" y="180" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#9a3412">One number. Which model made it, whether another model gives a different one,</text>
<text x="1030" y="206" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="18" fill="#9a3412">and whether it is the age to follow: the graph does not say.</text>
<line x1="50" y1="275" x2="1700" y2="275" stroke="#d8d6ce" stroke-width="1.2"/>
<text x="50" y="320" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="22" font-weight="500" fill="#1f1f1d">As geolod:AgeAssignment, one per model and sample</text>
