<text x="50" y="1060" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">The ontology anchors geolod:AgeAssignment in crm:E13_Attribute_Assignment; the values are read from the SISAL tables the graph is written from.</text>
<text x="50" y="1090" text-anchor="start" dominant-baseline="central" font-family="Fira Sans" font-size="17" fill="#55544f">IRIs follow sisal_rdf.add_ages. The assignment nodes belong to the large graph written by the pipeline; the committed Turtle holds the dating points and hiatuses only.</text>
